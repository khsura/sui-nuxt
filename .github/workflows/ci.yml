name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Set token npm github token
        run: echo NPM_GITHUB_TOKEN=${{ secrets.NPM_GITHUB_TOKEN }} > .env.yarn

      - name: Prepare Yarn version
        run: corepack prepare yarn@4.9.4 --activate

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Set token npm github token
        run: echo NPM_GITHUB_TOKEN=${{ secrets.NPM_GITHUB_TOKEN }} > .env.yarn

      - name: Prepare Yarn version
        run: corepack prepare yarn@4.9.4 --activate

      - name: Install dependencies
        run: yarn install

      - name: Playground prepare
        run: yarn dev:prepare

      - name: Test
        run: yarn test
